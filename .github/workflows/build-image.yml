name: Build image

# Builds the patched operator image (v2.0.0 + #152 reconciler fix) for amd64 and
# pushes it to GHCR. Our cluster nodes are amd64; upstream multi-arch is not needed.
# Drop this fork (and workflow) once bitwarden/sm-kubernetes#152 merges + releases.

on:
  push:
    branches: [fix/reconcile-secrets]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sm-operator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=v2.0.0-reconcilefix" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
